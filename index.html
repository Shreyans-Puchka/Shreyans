<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4285F4">
<link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreyans.AG</title>
    <style>
        /* Reset default browser spacing */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }

        /* Top Navigation Bar */
        header {
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px;
        }

        header a {
            text-decoration: none;
            color: #202124;
            font-size: 13px;
            margin-left: 15px;
            display: flex;
            align-items: center;
        }

        header a:hover {
            text-decoration: underline;
        }

        /* Sign In Button */
        .sign-in-btn {
            background-color: #1a73e8;
            color: white;
            padding: 9px 23px;
            border-radius: 4px;
            font-weight: 500;
        }

        .sign-in-btn:hover {
            background-color: #1557b0;
            text-decoration: none;
        }

        /* Main Search Container */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding-bottom: 100px; /* Shifts layout slightly up like real Google */
        }

        /* Shreyans.AG Logo Text Colors */
        .logo {
            font-size: 90px;
            font-weight: 500;
            letter-spacing: -3px;
            margin-bottom: 25px;
            user-select: none;
        }
        .g1 { color: #4285F4; }
        .o1 { color: #EA4335; }
        .o2 { color: #FBBC05; }
        .g2 { color: #4285F4; }
        .l  { color: #34A853; }
        .e  { color: #EA4335; }

        /* Search Form & Box */
        .search-form {
            width: 100%;
            max-width: 584px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-box {
            display: flex;
            width: 100%;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 15px;
            height: 46px;
            align-items: center;
            background: white;
            transition: box-shadow 0.1s;
        }

        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        /* Search Icon */
        .search-icon {
            color: #9aa0a6;
            margin-right: 10px;
            font-size: 16px;
        }

        .search-box input {
            flex-grow: 1;
            border: none;
            height: 100%;
            font-size: 16px;
            outline: none;
            color: #202124;
        }

        /* Action Buttons */
        .button-group {
            margin-top: 25px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            margin: 0 6px;
            padding: 0 16px;
            height: 36px;
            line-height: 27px;
            cursor: pointer;
        }

        .btn:hover {
            border: 1px solid #dadce0;
            color: #202124;
            background-color: #f8f9fa;
        }

        /* Footer Section */
        footer {
            background: #f2f2f2;
            color: #70757a;
            font-size: 14px;
            border-top: 1px solid #e4e4e4;
        }

        .footer-location {
            padding: 15px 30px;
            border-bottom: 1px solid #e4e4e4;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #70757a;
            text-decoration: none;
            margin-right: 30px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-right a {
            margin-right: 0;
            margin-left: 30px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <a href="#" class="sign-in-btn">Sign in</a>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Colorful Logo -->
        <div class="logo">
    <span class="g1">S</span>
    <span class="o1">h</span>
    <span class="o2">r</span>
    <span class="g2">e</span>
    <span class="l">y</span>
    <span class="e">a</span>
    <span class="g1">n</span>
    <span class="o1">s</span>
    <span class="o2">.</span>
    <span class="g2">A</span>
    <span class="l">G</span>
</div>

        <!-- Functional Search Form -->
        <form class="search-form" action="https://google.com" method="GET">
            <div class="search-box">
                <!-- Search Icon Representation -->
                <span class="search-icon">🔍</span>
                <input type="text" name="q" autocomplete="off" autofocus>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn">Google Search</button>
                <button type="button" class="btn" onclick="location.href='https://google.com'">I'm Feeling Lucky</button>
            </div>
        </form>
    </main>

    <!-- Footer Links -->
    <footer>
        <div class="footer-location">Earth</div>
        <div class="footer-links">
            <div class="footer-left">
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="footer-right">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
