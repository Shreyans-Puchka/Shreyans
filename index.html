<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreyans.AG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            background-color: #ffffff;
        }

        header {
            display: flex;
            justify-content: flex-end;
            padding: 15px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-links a {
            text-decoration: none;
            color: #000000;
            font-size: 13px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
            margin-top: -30px;
        }

        .logo-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-image {
            height: 400px; 
            width: auto;
            object-fit: contain;
            user-select: none;
        }

        .search-form {
            width: 100%;
            max-width: 584px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            width: 100%;
            border: 1px solid #e4e4e4;
            border-radius: 24px;
            padding: 10px 14px;
            align-items: center;
            background: #fff;
        }

        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-icon {
            color: #9aa0a6;
            margin-right: 10px;
            width: 20px;
            height: 20px;
        }

        .search-input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: #000;
        }

        .buttons-container {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 0 16px;
            line-height: 27px;
            height: 36px;
            min-width: 54px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .btn:hover {
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            background-image: -webkit-linear-gradient(top,#f8f8f8,#f1f1f1);
            background-color: #f8f9fa;
            border: 1px solid #c6c6c6;
            color: #222;
        }

        footer {
            background: #f2f2f2;
            color: #70757a;
            font-size: 14px;
        }

        .footer-location {
            padding: 15px 30px;
            border-bottom: 1px solid #dadce0;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #70757a;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-links-left, .footer-links-right {
            display: flex;
            gap: 25px;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-links">
            <a href="https://google.com">Gmail</a>
            <a href="https://google.com">Images</a>
        </div>
    </header>

    <main class="main-container">
        <div class="logo-container">
            <img class="logo-image" src="icon-512.png" alt="Shreyans.AG Logo">
        </div>

        <form class="search-form" action="https://google.com" method="GET">
            <div class="search-box">
                <svg class="search-icon" focusable="false" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                <input class="search-input" type="text" name="q" autofocus aria-label="Search">
            </div>
            <div class="buttons-container">
                <button class="btn" type="submit">Google Search</button>
                <button class="btn" type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
            </div>
        </form>
    </main>

    <footer>
        <div class="footer-location">India</div>
        <div class="footer-links">
            <div class="footer-links-left">
                <a href="https://about.google">About</a>
                <a href="https://advertising.google">Advertising</a>
                <a href="https://business.google">Business</a>
                <a href="https://google.com">How Search works</a>
            </div>
            <div class="footer-links-right">
                <a href="https://google.com">Privacy</a>
                <a href="https://google.com">Terms</a>
                <a href="https://google.com">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
